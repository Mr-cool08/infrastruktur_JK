
name: jk-cloudflare

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command: tunnel --no-autoupdate run

    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

    networks:
      - tunnel
      - private

networks:
  tunnel:
    external: true
    name: jk_tunnel_net

  private:
    external: true
    name: jk_private_net
